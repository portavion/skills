<svg viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How an upload is retried">
  <rect class="box" x="10" y="20" width="140" height="60" rx="8"/>
  <text x="80" y="55" text-anchor="middle">Upload starts</text>
  <rect class="box" x="180" y="20" width="140" height="60" rx="8"/>
  <text x="250" y="55" text-anchor="middle">Send the file</text>
  <rect class="box hl" x="350" y="20" width="140" height="60" rx="8"/>
  <text class="title" x="420" y="46" text-anchor="middle">Did it fail?</text>
  <text class="muted" x="420" y="64" text-anchor="middle">new check</text>
  <rect class="box good" x="520" y="20" width="160" height="60" rx="8"/>
  <text x="600" y="55" text-anchor="middle">Mark as done</text>
  <rect class="box bad" x="350" y="140" width="140" height="60" rx="8"/>
  <text x="420" y="166" text-anchor="middle">Wait, then retry</text>
  <text class="muted" x="420" y="184" text-anchor="middle">at most 3 times</text>
  <rect class="box bad" x="520" y="140" width="160" height="60" rx="8"/>
  <text x="600" y="166" text-anchor="middle">Give up and tell</text>
  <text x="600" y="184" text-anchor="middle">the user</text>
  <path class="line" d="M150 50 H178"/>
  <path class="line" d="M320 50 H348"/>
  <path class="line good" d="M490 50 H518"/>
  <text class="muted good" x="504" y="42" text-anchor="middle">no</text>
  <path class="line bad" d="M420 80 V138"/>
  <text class="muted bad" x="432" y="112">yes</text>
  <path class="line dash" d="M350 170 H250 V82"/>
  <path class="line bad" d="M490 170 H518"/>
  <text class="muted" x="504" y="162" text-anchor="middle">4th</text>
</svg>
